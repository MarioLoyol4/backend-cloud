server:
  port: 8083

spring:
  application:
    name: communication-service
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:guest}
    password: ${RABBIT_PASS:guest}

app:
  messaging:
    exchanges:
      eventos: colegio.eventos
      documentos: colegio.documentos
      retry: colegio.retry
      dlx: colegio.dlx
    queues:
      boletin-generado:
        name: notificaciones.boletin.queue
        routing-key: boletin.generado
      nota:
        name: notificaciones.nota.queue
        routing-key: nota.registrada
      asistencia:
        name: notificaciones.asistencia.queue
        routing-key: asistencia.ausente
      evaluacion:
        name: notificaciones.evaluacion.queue
        routing-key: evaluacion.creada
    suffix:
      retry: .retry
      dlq: .dlq
    retry:
      max-attempts: 3
      delay-ms: 5000