spring.application.name=bff-service
server.port=8080

# JWT
jwt.secret=${JWT_SECRET:clave-super-secreta-del-colegio-ohiggins-2024}
jwt.expiration=${JWT_EXPIRATION:86400000}

spring.security.user.name=disabled
spring.security.user.password=disabled

internal.api.key=${INTERNAL_API_KEY:colegio-ohiggins-internal-2024}

# URLs de microservicios
services.academic.url=http://localhost:8081
services.attendance.url=http://localhost:8082
services.communication.url=http://localhost:8083

spring.cloud.azure.active-directory.enabled=true
spring.cloud.azure.active-directory.credential.client-id=6a79422f-db95-4558-9839-e4ee1b79293f
spring.cloud.azure.active-directory.profile.tenant-id=a2e0837c-da02-42ff-926f-8be48950025d
spring.cloud.azure.active-directory.app-id-uri=api://6a79422f-db95-4558-9839-e4ee1b79293f/access_as_user

# Circuit Breaker - academic-service
resilience4j.circuitbreaker.instances.academic-service.sliding-window-size=10
resilience4j.circuitbreaker.instances.academic-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.academic-service.wait-duration-in-open-state=10s

# Circuit Breaker - attendance-service
resilience4j.circuitbreaker.instances.attendance-service.sliding-window-size=10
resilience4j.circuitbreaker.instances.attendance-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.attendance-service.wait-duration-in-open-state=10s

# Circuit Breaker - communication-service (listo para cuando lo uses)
resilience4j.circuitbreaker.instances.communication-service.sliding-window-size=10
resilience4j.circuitbreaker.instances.communication-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.communication-service.wait-duration-in-open-state=10s
