spring:
  rabbitmq:
# Conexión
  host: rabbitmq.production.com
  port: 5672
  username: ${RABBITMQ_USER}
  password: ${RABBITMQ_PASSWORD}
  virtual-host: /
# Pool de conexiones
  connection-timeout: 10s
# Auto-recovery
  requested-heartbeat: 30
# Retry
  template:
    retry:

    enabled: true
    initial-interval: 1000
    max-interval: 30000
    multiplier: 2.0
    max-attempts: 3
# Listener
  amqp:
    listener:
    type: simple
    simple:
    prefetch: 1 # Procesar 1 mensaje a la vez
    concurrency: 1-3 # 1-3 threads de consumo
    acknowledge-mode: manual # Confirmación manual
    max-attempts: 3 # Reintentos
    default-requeue-rejected: false