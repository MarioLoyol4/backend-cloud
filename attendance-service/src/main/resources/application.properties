# Puerto para el microservicio de asistencia
server.port=8082
spring.application.name=attendance-service

# Base de datos independiente para Asistencia
spring.datasource.url=jdbc:h2:file:./data/attendancedb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

internal.api.key=${INTERNAL_API_KEY:colegio-ohiggins-internal-2024}

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
